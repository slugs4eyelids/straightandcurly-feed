name: Update product feed

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the chatgpt tab of the feed sheet as CSV
        run: |
          curl -sSL --fail --retry 3 -o new.csv "https://docs.google.com/spreadsheets/d/1vcdy4dvIf_g4JYq-qEmIr9AGi6EupPCNjOiPDb0A-ZY/export?format=csv&gid=1705286380"
          head -c 7 new.csv | grep -q '^item_id' || { echo "Unexpected header"; exit 1; }
          if grep -q -e '#REF!' -e '#ERROR!' -e '#N/A' -e '#VALUE!' new.csv; then echo "Sheet formula error in feed"; exit 1; fi
          rows=$(python3 -c "import csv; print(sum(1 for _ in csv.reader(open('new.csv', newline='', encoding='utf-8'))) - 1)")
          echo "Rows: $rows"
          [ "$rows" -ge 2000 ] || { echo "Too few rows, keeping the previous feed"; exit 1; }
          mv new.csv feed.csv

      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.csv
          git diff --cached --quiet || git commit -m "Update feed"
          git push
